<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hello Iceland</title>
  <style>
    :root {
      --bg-color: #0b1320;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
      --accent: #58a6ff;
      --aurora: linear-gradient(135deg, #38ef7d 0%, #11998e 50%, #00d2ff 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 239, 125, 0.15), transparent),
        radial-gradient(ellipse 60% 50% at 50% 120%, rgba(0, 210, 255, 0.12), transparent);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 28px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .flag {
      font-size: 54px;
      line-height: 1;
      margin-bottom: 20px;
      display: inline-block;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: var(--aurora);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 15px;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(88, 166, 255, 0.12);
      border: 1px solid rgba(88, 166, 255, 0.25);
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38ef7d;
      box-shadow: 0 0 8px #38ef7d;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="flag">🇮🇸</div>
    <h1>Hello Iceland</h1>
    <p class="tagline">2027 年 9 月冰岛之旅<br>行程手册与规划中，敬请期待</p>
    <div class="badge">
      <span class="badge-dot"></span>
      <span>GitHub Pages Online</span>
    </div>
  </main>
</body>
</html>
